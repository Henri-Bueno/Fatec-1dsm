<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <title>Exemplo 1</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <form>
      <div style="background-color:rgb(255, 241, 45)">
        <label for="nome">Nome</label>
        <input value="" id="nome" placeholder="Nome completo" />
      </div>
      <div style="background-color: rgb(255, 0, 255);">
        <label for="idade">Idade</label>
        <input id="idade" type="number" placeholder="sua idade" min="18" max="30">
      </div>
      <div style="background-color: rgb(94, 255, 0);">
        <label for="dia">dia da semana</label>
        <select id="dia" size="2">
            <option>Domingo</option>
            <option>segunda-feira</option>
            <option>terçca-feira</option>
            <option>quarta-feira</option>
            <option>quinta-feira</option>
            <option>sexta-feira</option>
            <option>sabado</option>
        </select>
      </div>
      <div style="background-color: crimson;">
        <input type="radio" value="massa" name="comida" id="massa">
        <label for="massa">Massa</label>
        <input type="radio" value="carne" name="comida" id="carne">
        <label for="carne">Carne</label>
        <input type="radio" value="salada" name="comida" id="salada">
        <label for="salada">Salada</label>
    </div>
 </div>
      <div style="background-color: rgb(5, 4, 4);">
        <input type="checkbox" value="doce" name="comida" id="doce">
        <label for="doce">Doce</label>
        <input type="checkbox" value="sorvete" name="comida" id="sorvete">
        <label for="sorvete">Sorvete</label>
        <input type="checkbox" value="bala" name="comida" id="bala">
        <label for="bala">Bala</label>
    </div>
    <div style="background-color: aqua;">
        <textarea rows="7" cols="50" placeholder="Seus comentários"></textarea>
    </div>
    <div style="background-color: rgb(149, 20, 255);">
        <button>Salvar</button>
        <button>Limpar</button>
    </div>
    </form>
    <img src="imagens/images.jfif">
  </body>
</html>
