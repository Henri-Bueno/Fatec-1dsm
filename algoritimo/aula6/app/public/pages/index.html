<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://www.cps.sp.gov.br/favicon.ico" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSM | Cadastro</title>
  </head>

  <body>
    <main class="card">
      <h1 class="title">Cadastro de Usuários</h1>
      <input
        class="user-input"
        id="user-name"
        placeholder="Digite o nome de usuário"
      />
      <input class="user-input" id="user-email" placeholder="Digite o e-mail" />
      <div class="actions">
        <button class="action-button action-button-primary">Salvar</button>
        <button class="action-button action-button-secondary">Limpar</button>
      </div>
    </main>
  </body>
</html>
